<!DOCTYPE html>
<html>
<head>
  <title>Zoom 18 Polygon & Tile Area (Enhanced Precision)</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
    #results {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 999;
      background-color: rgba(255, 255, 255, 0.85);
      padding: 10px;
      border-radius: 5px;
      max-width: 300px;
      font: 14px/1.4 sans-serif;
      overflow: auto;
      max-height: 400px;
    }
    #results h3 { margin: 0 0 5px 0; font-size: 16px; }
    #results pre { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="results">
    <h3>Polygon & Tile Info</h3>
    <div id="infoText">Draw a polygon using the Leaflet Draw tools.</div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    const map = L.map('map', {
      center: [0, 0],
      zoom: 2
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      edit: {
        featureGroup: drawnItems
      },
      draw: {
        polygon: true,
        rectangle: false,
        polyline: false,
        circle: false,
        marker: false,
        circlemarker: false
      }
    });
    map.addControl(drawControl);

    const ZOOM_LEVEL = 18;
    const TILE_COUNT = Math.pow(2, ZOOM_LEVEL); // 2^18 = 262144
    const EARTH_RADIUS_METERS = 6371000;
    const TILE_SIZE_PIXELS = 256;
    const M2_TO_FT2 = 10.7639104167097;  // More precise conversion factor

    function latLonToTile(lat, lon, zoom) {
      const x = Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
      const latRad = lat * Math.PI / 180;
      const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * Math.pow(2, zoom));
      return [x, y];
    }

    function tileToLatLonBounds(x, y, zoom) {
      const n = Math.pow(2, zoom);
      const west = x / n * 360 - 180;
      const east = (x + 1) / n * 360 - 180;
      const north = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI;
      const south = Math.atan(Math.sinh(Math.PI * (1 - 2 * (y + 1) / n))) * 180 / Math.PI;
      return { west, east, north, south };
    }

    function tileId(tx, ty) {
      return `${tx},${ty}`;
    }

    function getGroundResolution(latitude, zoom) {
      const latitudeRadians = latitude * Math.PI / 180;
      return Math.cos(latitudeRadians) * 2 * Math.PI * EARTH_RADIUS_METERS / 
             (TILE_SIZE_PIXELS * Math.pow(2, zoom));
    }

    function getTileArea(latitude, zoom) {
      const resolution = getGroundResolution(latitude, zoom);
      return Math.pow(TILE_SIZE_PIXELS * resolution, 2);
    }

    // Enhanced rounding function
    function smartRound(value) {
      // Round to nearest integer, but with a tiny bias upward
      // This helps with precision issues that might cause numbers to round down
      // when they should round up
      return Math.round(value + 0.0000001);
    }

    map.on(L.Draw.Event.CREATED, function (e) {
      drawnItems.clearLayers();
      const layer = e.layer;
      drawnItems.addLayer(layer);

      const latlngs = layer.getLatLngs()[0];
      const coordinates = latlngs.map(ll => [ll.lng, ll.lat]);
      coordinates.push(coordinates[0]);
      
      const userPolyFeature = turf.polygon([coordinates]);
      const bounds = layer.getBounds();
      const [minTileX, minTileY] = latLonToTile(bounds.getNorth(), bounds.getWest(), ZOOM_LEVEL);
      const [maxTileX, maxTileY] = latLonToTile(bounds.getSouth(), bounds.getEast(), ZOOM_LEVEL);

      const tileResults = [];
      const processedTiles = new Set();

      for (let tx = Math.min(minTileX, maxTileX); tx <= Math.max(minTileX, maxTileX); tx++) {
        for (let ty = Math.min(minTileY, maxTileY); ty <= Math.max(minTileY, maxTileY); ty++) {
          const tileIdStr = tileId(tx, ty);
          const tileIdCalc = tx + ty * TILE_COUNT;
          if (processedTiles.has(tileIdStr)) continue;
          processedTiles.add(tileIdStr);

          const tileBounds = tileToLatLonBounds(tx, ty, ZOOM_LEVEL);
          const tileCoords = [
            [tileBounds.west, tileBounds.north],
            [tileBounds.east, tileBounds.north],
            [tileBounds.east, tileBounds.south],
            [tileBounds.west, tileBounds.south],
            [tileBounds.west, tileBounds.north]
          ];

          const tilePolyFeature = turf.polygon([tileCoords]);
          const centerLat = (tileBounds.north + tileBounds.south) / 2;
          const fullTileArea = getTileArea(centerLat, ZOOM_LEVEL);

          try {
            const intersection = turf.intersect(
              turf.truncate(userPolyFeature, { precision: 12 }), // Increased precision
              turf.truncate(tilePolyFeature, { precision: 12 })
            );

            if (intersection) {
              const intersectionArea = turf.area(intersection);
              const totalArea = turf.area(tilePolyFeature);
              const ratio = intersectionArea / totalArea;
              
              // Calculate area with enhanced precision
              const finalAreaM2 = fullTileArea * ratio;
              const areaInSqFt = smartRound(finalAreaM2 * M2_TO_FT2);

              tileResults.push({
                tileId: tileIdCalc,
                areaSqFt: areaInSqFt
              });

              L.geoJSON(intersection, {
                style: {
                  fillColor: '#ff7800',
                  weight: 1,
                  opacity: 1,
                  color: 'white',
                  fillOpacity: 0.7
                }
              }).addTo(drawnItems);
            }
          } catch (error) {
            console.error(`Error processing tile ${tileIdStr}:`, error);
          }
        }
      }

      const totalTileArea = tileResults.reduce((sum, tile) => sum + tile.areaSqFt, 0);

      let resultText = '';
      resultText += `Total Polygon Area (sq ft): ${totalTileArea.toFixed(2)}\n`;
      resultText += `Number of Intersecting Tiles: ${tileResults.length}\n\n`;
      resultText += `Individual Tile Areas:\n`;
      tileResults.forEach(t => {
        resultText += `Tile ${t.tileId}: ${t.areaSqFt} sq ft\n`;
      });

      document.getElementById('infoText').textContent = resultText;
    });
  </script>
</body>
</html>
